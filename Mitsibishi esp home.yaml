substitutions:
  device_name: downstairs-bed-ac
  friendly_name: Downstairs Bed AC

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret homeassistant_api_encryption
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

safe_mode:
  boot_is_good_after: 1min
  num_attempts: 10
  reboot_timeout: 10min

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 30min

external_components:
  - source: github://echavet/MitsubishiCN105ESPHome
    components: [cn105]

uart:
  id: ac_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 2400
  data_bits: 8
  parity: EVEN
  stop_bits: 1

climate:
  - platform: cn105
    id: heat_pump
    uart_id: ac_uart
    name: "Air Conditioner"
    icon: mdi:heat-pump

    update_interval: 2s
    debounce_delay: 100ms
    remote_temperature_timeout: 5min

    outside_air_temperature_sensor:
      name: "Outside Air Temperature"
      disabled_by_default: false

    compressor_frequency_sensor:
      name: "Compressor Frequency"
      entity_category: diagnostic
      disabled_by_default: false

    input_power_sensor:
      name: "Input Power"
      disabled_by_default: false

    kwh_sensor:
      name: "Energy Usage"
      disabled_by_default: false

    runtime_hours_sensor:
      name: "Runtime Hours"
      entity_category: diagnostic
      disabled_by_default: false

    stage_sensor:
      name: "Operating Stage"
      entity_category: diagnostic
      disabled_by_default: false

    sub_mode_sensor:
      name: "Sub Mode"
      entity_category: diagnostic
      disabled_by_default: false

    auto_sub_mode_sensor:
      name: "Auto Sub Mode"
      entity_category: diagnostic
      disabled_by_default: false

    isee_sensor:
      name: "I-See Status"
      entity_category: diagnostic
      disabled_by_default: false

    vertical_vane_select:
      name: "Vertical Vane"
      disabled_by_default: false

    horizontal_vane_select:
      name: "Horizontal Vane"
      disabled_by_default: false

binary_sensor:
  - platform: status
    name: "Controller Connection"
    entity_category: diagnostic

sensor:
  - platform: template
    name: "Room Temperature"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      return id(heat_pump).current_temperature;

  - platform: template
    name: "Target Temperature"
    device_class: temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      return id(heat_pump).target_temperature;

  - platform: uptime
    name: "Controller Uptime"
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "Firmware Version"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart Controller"
    entity_category: diagnostic
    disabled_by_default: true

  - platform: safe_mode
    name: "Restart in Safe Mode"
    entity_category: diagnostic
    disabled_by_default: true
